version: '3.8'

# ====================================================================
# RoutePass / Transport Navigator - Production Multi-Container Stack
# Includes Private PostgreSQL 16, Node.js API, and Nginx (SSL/TLS Ready)
# Production Security: Only ports 80 and 443 are exposed to the internet.
# ====================================================================

services:
  # 1. Private Persistent PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: routepass_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routepass_db}
      POSTGRES_USER: ${POSTGRES_USER:-routepass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # CRITICAL: PostgreSQL is private. No ports published to the host/internet in production.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routepass} -d ${POSTGRES_DB:-routepass_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - routepass_internal

  # 2. Node.js Express & WebSocket API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routepass_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-routepass}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}@db:5432/${POSTGRES_DB:-routepass_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      JWT_EXPIRES_IN: 30d
      ADMIN_REGISTRATION_SECRET: ${ADMIN_REGISTRATION_SECRET:?Set ADMIN_REGISTRATION_SECRET in backend/.env}
      PAYMENT_MODE: ${PAYMENT_MODE:?Set PAYMENT_MODE explicitly in backend/.env}
      ALLOW_MANUAL_TEST_RECHARGE: ${ALLOW_MANUAL_TEST_RECHARGE:-false}
      QR_SIGNING_KEY: ${QR_SIGNING_KEY:?Set QR_SIGNING_KEY in backend/.env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TELEBIRR_APP_ID: ${TELEBIRR_APP_ID:-}
      TELEBIRR_APP_KEY: ${TELEBIRR_APP_KEY:-}
      TELEBIRR_SHORT_CODE: ${TELEBIRR_SHORT_CODE:-}
      TELEBIRR_PUBLIC_KEY: ${TELEBIRR_PUBLIC_KEY:-}
      TELEBIRR_WEBHOOK_SECRET: ${TELEBIRR_WEBHOOK_SECRET:-}
      TELEBIRR_QUERY_URL: ${TELEBIRR_QUERY_URL:-}
      TELEBIRR_NOTIFY_URL: ${TELEBIRR_NOTIFY_URL:-}
      DATA_DIR: /app/data
      ROUTEPASS_PRIVATE_MEDIA_DIR: /app/data/private-media
    volumes:
      - routepass_app_data:/app/data
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - routepass_internal

  # 3. Nginx Reverse Proxy with HTTPS / SSL & WebSocket Upgrade
  nginx:
    image: nginx:alpine
    container_name: routepass_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - routepass_internal

volumes:
  postgres_data:
    name: routepass_postgres_data
  routepass_app_data:
    name: routepass_app_data

networks:
  routepass_internal:
    driver: bridge
    name: routepass_internal_net
