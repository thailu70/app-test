worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Traefik is the only exposed entry. Its final forwarded hop is the actual
  # caller; preserve that address rather than pooling every tester under the
  # proxy container IP. There is no published port on this review proxy.
  map $http_x_forwarded_for $review_client_ip {
    ~(?<review_last_ip>[^,\s]+)$ $review_last_ip;
    default $remote_addr;
  }
  server {
    listen 8080;
    client_max_body_size 6m;
    location /api/ {
      proxy_pass http://review-api:3000;
      proxy_set_header Host passo.live;
      proxy_set_header X-Forwarded-For $review_client_ip;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 60s;
    }
    location = /ws {
      proxy_pass http://review-api:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $review_client_ip;
      proxy_read_timeout 90s;
    }
    location / { return 404; }
  }
}
