# Nginx Reverse Proxy Configuration for Transport Navigator VPS
# Place in /etc/nginx/sites-available/transport-navigator or use via Docker

upstream transport_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP - Redirect all traffic to HTTPS (or serve directly if SSL not yet configured)
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.et your-vps-ip;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS once SSL certificate is issued:
    # return 301 https://$host$request_uri;

    # Direct proxy pass for HTTP before SSL setup:
    location / {
        proxy_pass http://transport_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Buffer settings
        proxy_buffering off;
        client_max_body_size 10M;
    }
}

