services:
  api:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=routepass_internal_net"
      - "traefik.http.routers.routepass-api.rule=Host(`${ROUTEPASS_DOMAIN}`)"
      - "traefik.http.routers.routepass-api.entrypoints=websecure"
      - "traefik.http.routers.routepass-api.tls=true"
      - "traefik.http.routers.routepass-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.routepass-api.service=routepass-api"
      # DNS aliases still need their own valid certificate before HTTPS can redirect.
      # This router requests www independently and keeps path/query on the canonical host.
      - "traefik.http.routers.routepass-www.rule=Host(`www.${ROUTEPASS_DOMAIN}`)"
      - "traefik.http.routers.routepass-www.entrypoints=websecure"
      - "traefik.http.routers.routepass-www.tls=true"
      - "traefik.http.routers.routepass-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.routepass-www.service=routepass-api"
      - "traefik.http.routers.routepass-www.middlewares=routepass-canonical"
      - "traefik.http.middlewares.routepass-canonical.redirectregex.regex=^https?://[^/]+(.*)"
      - "traefik.http.middlewares.routepass-canonical.redirectregex.replacement=https://${ROUTEPASS_DOMAIN}$${1}"
      - "traefik.http.middlewares.routepass-canonical.redirectregex.permanent=true"
      # Optional migration alias; use the primary host when no legacy hostname is configured.
      # Separate routers keep certificate renewal independent for the two domains.
      - "traefik.http.routers.routepass-legacy.rule=Host(`${ROUTEPASS_LEGACY_DOMAIN:-${ROUTEPASS_DOMAIN}}`)"
      - "traefik.http.routers.routepass-legacy.entrypoints=websecure"
      - "traefik.http.routers.routepass-legacy.tls=true"
      - "traefik.http.routers.routepass-legacy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.routepass-legacy.service=routepass-api"
      - "traefik.http.services.routepass-api.loadbalancer.server.port=3000"
  # Existing Traefik already owns host ports 80/443. Keep the bundled Nginx
  # service available only for deployments that explicitly opt into this profile.
  nginx:
    profiles:
      - nginx-proxy
